name: Deploy Saturn Global FZCO to S3 & CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Build project
        run: npm run build

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: 🪣 Deploy to S3 (Clean Industry Standard SPA)
        env:
          RAW_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          # Sanitize BUCKET: strip quotes, carriage returns, newlines, whitespace, s3:// prefix, and trailing slashes
          BUCKET=$(echo "$RAW_BUCKET" | tr -d "\r\n\"'" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's|^s3://||' -e 's|/*$||')

          if [ -z "$BUCKET" ]; then
            echo "::error::AWS_S3_BUCKET secret is empty or unset!"
            exit 1
          fi

          echo "Target S3 bucket resolved: s3://${BUCKET}"

          aws s3 sync dist "s3://${BUCKET}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"

          if [ -f dist/404.html ]; then
            aws s3 cp dist/404.html "s3://${BUCKET}/404.html" \
              --cache-control "public, max-age=0, must-revalidate" \
              --content-type "text/html; charset=utf-8"
          fi

          for route in about services markets mining marketdata market-data faq contact contactus; do
            aws s3 cp dist/index.html "s3://${BUCKET}/${route}" \
              --cache-control "public, max-age=0, must-revalidate" \
              --content-type "text/html; charset=utf-8"
          done

      - name: 🔄 Invalidate CloudFront Cache
        env:
          RAW_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          DIST_ID=$(echo "$RAW_DIST_ID" | tr -d "\r\n\"' " | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -n "$DIST_ID" ]; then
            echo "Invalidating CloudFront distribution $DIST_ID..."
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID secret not set. Skipping automated CloudFront invalidation."
          fi
