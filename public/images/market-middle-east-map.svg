<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <!-- Background transparent -->
  <defs>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="480" fill="transparent" />

  <!-- Surrounding landmasses (Subtle obsidian noir) -->
  <g fill="#1C1E26" stroke="#2E313D" stroke-width="1.2">
    <!-- North Africa / Egypt -->
    <path d="M40 240 L120 220 L160 270 L140 360 L60 380 Z" opacity="0.6" />
    
    <!-- Central Mediterranean / Europe border -->
    <path d="M80 120 L160 100 L210 130 L160 180 Z" opacity="0.5" />
    
    <!-- Levant / Jordan / Syria / Iraq -->
    <path d="M190 200 L250 170 L340 200 L320 260 L240 260 Z" opacity="0.7" />
    
    <!-- Iran / Caucasus -->
    <path d="M340 180 L440 160 L500 230 L450 300 L350 250 Z" opacity="0.7" />
    
    <!-- Arabian Peninsula (Main base) -->
    <path d="M230 270 L330 260 L380 320 L440 340 L420 440 L340 450 L260 390 L240 320 Z" fill="#181A22" stroke="#333745" />
  </g>

  <!-- TURKEY (Highlighted in Brushed Gold) -->
  <g filter="url(#goldGlow)">
    <path
      d="M160 130 L230 120 L330 130 L360 170 L300 190 L210 185 L160 160 Z"
      fill="#C5A059"
      stroke="#E2C37E"
      stroke-width="1.5"
    />
    <!-- Turkey Label -->
    <circle cx="260" cy="155" r="4" fill="#0E0F14" />
    <text x="270" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">TURKEY</text>
  </g>

  <!-- UAE / DUBAI (Highlighted in Luxury Gold) -->
  <g filter="url(#goldGlow)">
    <!-- UAE shape at the Persian Gulf -->
    <path
      d="M390 325 L430 330 L445 355 L425 365 L395 345 Z"
      fill="#C5A059"
      stroke="#FFE8A3"
      stroke-width="2"
    />
    <!-- Dubai Hub Marker Pin -->
    <circle cx="420" cy="340" r="5" fill="#FFE8A3" />
    <circle cx="420" cy="340" r="10" fill="none" stroke="#C5A059" stroke-width="1.5" opacity="0.8">
      <animate attributeName="r" values="5;14" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="435" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#E2C37E">DUBAI (UAE)</text>
    <text x="435" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#C5A059">Headquarters &amp; Vaults</text>
  </g>

  <!-- Gold Trade Routes Connecting Dubai to Turkey & Regional Markets -->
  <g stroke="#C5A059" stroke-width="1.8" stroke-dasharray="4,4" fill="none" opacity="0.85">
    <!-- Dubai to Istanbul/Turkey route -->
    <path d="M420 340 Q340 240 260 155" />
    <!-- Dubai to East Africa / Red Sea -->
    <path d="M420 340 Q330 390 190 320" />
    <!-- Dubai to Central Asia -->
    <path d="M420 340 Q460 270 480 210" />
  </g>

  <!-- Water bodies labels (Subtle) -->
  <text x="345" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6A6F82" font-style="italic">Arabian Gulf</text>
  <text x="210" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6A6F82" font-style="italic">Red Sea</text>
</svg>
