<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" fill="none" width="100%" height="100%">
  <!-- Africa Continent SVG with Brushed Gold highlighted partner countries -->
  <g stroke="#3A3834" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- North Africa (Morocco, Algeria, Libya, Egypt) -->
    <path d="M120,40 L160,20 L210,30 L220,70 L150,80 Z" fill="#FBF8F1"/>
    <path d="M160,20 L230,25 L290,40 L300,90 L220,70 Z" fill="#FBF8F1"/>
    <path d="M290,40 L340,50 L340,110 L280,105 L300,90 Z" fill="#FBF8F1"/>
    <path d="M340,50 L400,60 L410,120 L340,110 Z" fill="#FBF8F1"/>

    <!-- Highlighted Partner Countries in West & Central Africa (Luxury Gold #C5A059) -->
    <!-- Mali & Mauritania Region -->
    <path d="M120,90 L160,80 L220,70 L240,120 L180,140 L140,150 L120,110 Z" fill="#C5A059"/>
    <!-- Niger Region -->
    <path d="M220,70 L300,90 L320,150 L270,160 L240,120 Z" fill="#C5A059"/>
    <!-- Chad & Sudan Region -->
    <path d="M300,90 L340,110 L400,120 L380,190 L320,170 L320,150 Z" fill="#C5A059"/>

    <!-- Guinea, Ivory Coast, Ghana Gold Belt (Highlighted in Gold) -->
    <path d="M100,150 L140,150 L150,180 L110,190 Z" fill="#C5A059"/>
    <path d="M140,150 L180,140 L190,190 L150,180 Z" fill="#C5A059"/>
    <!-- Ghana & Burkina Faso (Key Gold Hub) -->
    <path d="M180,140 L220,135 L225,185 L190,190 Z" fill="#B89047"/>
    <path d="M220,135 L250,135 L250,185 L225,185 Z" fill="#B89047"/>
    <path d="M110,190 L160,185 L170,230 L115,220 Z" fill="#C5A059"/>
    <path d="M160,185 L210,185 L200,230 L170,230 Z" fill="#C5A059"/>

    <!-- Nigeria & Cameroon -->
    <path d="M250,135 L300,140 L310,190 L260,200 L250,185 Z" fill="#FBF8F1"/>
    <path d="M260,200 L310,190 L330,240 L270,250 Z" fill="#FBF8F1"/>

    <!-- Central Africa & DRC (Highlighted Gold/Mineral Belt) -->
    <path d="M310,190 L380,190 L370,260 L320,270 L330,240 Z" fill="#C5A059"/>
    <path d="M270,250 L330,240 L350,320 L280,310 Z" fill="#C5A059"/>

    <!-- Horn of Africa (Ethiopia, Somalia) -->
    <path d="M380,190 L440,200 L490,260 L450,290 L390,260 Z" fill="#FBF8F1"/>

    <!-- East Africa (Kenya, Tanzania) -->
    <path d="M350,260 L420,270 L410,340 L340,330 Z" fill="#FBF8F1"/>

    <!-- Southern Africa (Angola, Zambia, Zimbabwe, Mozambique) -->
    <path d="M280,310 L350,320 L340,400 L260,380 Z" fill="#FBF8F1"/>
    <path d="M350,320 L410,340 L400,420 L340,400 Z" fill="#FBF8F1"/>

    <!-- South Africa, Namibia, Botswana -->
    <path d="M260,380 L340,400 L330,480 L250,450 Z" fill="#FBF8F1"/>
    <path d="M340,400 L400,420 L370,510 L310,500 L330,480 Z" fill="#FBF8F1"/>

    <!-- Southern Tip -->
    <path d="M270,470 L340,480 L320,560 L280,550 Z" fill="#FBF8F1"/>

    <!-- Madagascar -->
    <path d="M470,390 C480,410 490,440 480,470 C470,500 460,520 455,490 C450,450 460,410 470,390 Z" fill="#FBF8F1"/>
  </g>
</svg>
