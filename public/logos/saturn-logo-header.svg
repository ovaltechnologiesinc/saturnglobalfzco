<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" fill="none">
  <defs>
    <!-- Rich metallic gold gradient for the bar top -->
    <linearGradient id="goldBarTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Metallic gold gradient for the bar front/side -->
    <linearGradient id="goldBarFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="40%" stop-color="#CA8A04" />
      <stop offset="85%" stop-color="#996515" />
      <stop offset="100%" stop-color="#78450A" />
    </linearGradient>

    <!-- Metallic gold gradient for the bar end facet -->
    <linearGradient id="goldBarEnd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D99B26" />
      <stop offset="50%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>

    <!-- Golden planetary rings gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Inner rim ring gradient -->
    <linearGradient id="goldRingRim" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="50%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <!-- English Typography metallic gold gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="20%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C68A24" />
      <stop offset="25%" stop-color="#F5CE68" />
      <stop offset="50%" stop-color="#FFEFA8" />
      <stop offset="75%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Sparkle star gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. EMBLEM: 3D Gold Bar with Saturn Rings and Sparkles           -->
  <!-- ============================================================== -->
  <g transform="translate(6, 6)">
    <!-- BACK HALF OF SATURN RINGS (Behind the gold bar) -->
    <g transform="rotate(-26, 60, 52)">
      <!-- Outer back arc -->
      <path d="M 12,52 A 52,22 0 0,1 108,52" fill="none" stroke="url(#goldRing)" stroke-width="7" stroke-linecap="round" />
      <path d="M 17,52 A 47,17 0 0,1 103,52" fill="none" stroke="url(#goldRingRim)" stroke-width="2" opacity="0.9" />
    </g>

    <!-- 3D GOLD INGOT / BULLION (Tilted in perspective) -->
    <!-- Shadow beneath the bar -->
    <polygon points="34,70 66,88 92,68 62,54" fill="#000000" opacity="0.12" />

    <!-- Left end facet of the gold bar -->
    <polygon points="34,44 48,34 48,56 34,68" fill="url(#goldBarEnd)" />
    <!-- Front long face of the gold bar -->
    <polygon points="48,34 94,54 84,76 34,68 48,56" fill="url(#goldBarFront)" />
    <!-- Top face of the gold bar (Bright reflection) -->
    <polygon points="34,44 48,34 94,54 80,64" fill="url(#goldBarTop)" />

    <!-- Specular highlight line on top ridge -->
    <line x1="48" y1="34" x2="94" y2="54" stroke="#FFFBEB" stroke-width="1.8" stroke-linecap="round" />
    <line x1="34" y1="44" x2="48" y2="34" stroke="#FFFBEB" stroke-width="1.4" stroke-linecap="round" />

    <!-- FRONT HALF OF SATURN RINGS (Loops IN FRONT of the gold bar) -->
    <g transform="rotate(-26, 60, 52)">
      <!-- Outer front arc -->
      <path d="M 12,52 A 52,22 0 0,0 108,52" fill="none" stroke="url(#goldRing)" stroke-width="7" stroke-linecap="round" />
      <!-- Bevel accent highlight -->
      <path d="M 15,53 A 49,19 0 0,0 105,53" fill="none" stroke="#FFF7B2" stroke-width="1.6" opacity="0.85" />
      <!-- Inner front rim -->
      <path d="M 20,52 A 44,14 0 0,0 100,52" fill="none" stroke="url(#goldRingRim)" stroke-width="2.5" opacity="0.95" />
    </g>

    <!-- FOUR-POINT DIAMOND SPARKLES -->
    <!-- Main Sparkle (mid-left) -->
    <g transform="translate(14, 40) scale(1.1)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Secondary Sparkle (lower-left) -->
    <g transform="translate(20, 68) scale(0.75)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="url(#sparkleGrad)" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 2. TYPOGRAPHY: Arabic (Top) & English Metallic Gold (Bottom)   -->
  <!-- ============================================================== -->
  <!-- Arabic Text: ساترن غلوبال ش.م.ح (Bold Black/Dark Charcoal) -->
  <text 
    x="132" 
    y="46" 
    font-family="'Geeza Pro', 'Noto Sans Arabic', 'Segoe UI', Arial, sans-serif" 
    font-size="34" 
    font-weight="700" 
    fill="#111827" 
    letter-spacing="0.5"
  >ساترن غلوبال ش.م.ح</text>

  <!-- English Text: SATURN GLOBAL FZCO (Metallic Gold Serif Font) -->
  <text 
    x="132" 
    y="86" 
    font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif" 
    font-size="28" 
    font-weight="700" 
    fill="url(#goldTextGrad)" 
    letter-spacing="2.8"
  >SATURN GLOBAL FZCO</text>
</svg>
